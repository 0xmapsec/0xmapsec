# Genera la tarjeta de estadisticas (profile/stats.svg) dentro del propio repo.
name: Actualizar stats del perfil

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generar tarjeta de stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=prs,issues&bg_color=000000&title_color=00ff41&text_color=e6edf3&icon_color=00ff41&ring_color=00ff41&border_color=1f6f2e&border_radius=8"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar la tarjeta en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar stats" || exit 0
          git push
